services:
  - type: web
    name: axiem-praxl
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_URL
        value: https://axiem-praxl.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: praxl-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: praxl-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
